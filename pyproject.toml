[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-model"
version = "0.6"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "mpl_ascii",
    "numpy",
]

[project.optional-dependencies]
testing = [
  "pytest",
  "nbmake",
]

[tool.setuptools]
py-modules = ["diffusion_model"]
